name: Test and publish Module 10 calculator

on:
  push:
    branches: [main]
    paths:
      - 'Module10/Part1/Lab02/**'
      - '.github/workflows/module10-docker.yml'
  pull_request:
    paths:
      - 'Module10/Part1/Lab02/**'
      - '.github/workflows/module10-docker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-publish:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Module10/Part1/Lab02

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Module10/Part1/Lab02/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test calculator
        run: npm test

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ./Module10/Part1/Lab02
          push: ${{ github.event_name != 'pull_request' }}
          tags: henrog94/module10-calculator:latest