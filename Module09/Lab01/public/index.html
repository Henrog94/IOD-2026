<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MVC Calculator</title><style>body{font:18px system-ui;background:#111827;color:white;max-width:650px;margin:60px auto;padding:20px}input,select,button{padding:12px;margin:8px 0;font:inherit;box-sizing:border-box;width:100%}output{display:block;padding:20px;background:#263249}</style><h1>MVC Calculator</h1><form id="calc"><input id="a" type="number" step="any" required aria-label="First number"><select id="op" aria-label="Operation"><option>add</option><option>subtract</option><option>multiply</option><option>divide</option></select><input id="b" type="number" step="any" required aria-label="Second number"><button>Calculate</button></form><output id="result" aria-live="polite">Enter two numbers.</output><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/api/calculator/'+op.value+'?'+new URLSearchParams({a:a.value,b:b.value}));const data=await r.json();result.textContent=data.error||data.result;}catch(e){result.textContent='Unable to reach server';}};</script></html>
