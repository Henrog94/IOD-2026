<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Chat</title><style>body{font:17px system-ui;max-width:760px;margin:30px auto;padding:20px;background:#101827;color:white}input,button{padding:12px;font:inherit}#messages{height:45vh;overflow:auto;background:#233047;padding:16px}input{max-width:65%}</style><h1>Live Chat</h1><form id="join"><input id="nickname" maxlength="24" required placeholder="Nickname" aria-label="Nickname"><button>Join</button></form><p id="status">Connecting...</p><p id="online"></p><div id="messages" role="log" aria-live="polite"></div><p id="typing"></p><form id="chat" hidden><input id="message" maxlength="1000" required placeholder="Message" aria-label="Message"><button>Send</button></form><script src="/socket.io/socket.io.js"></script><script>
const socket=io();let name='',timer;const active=new Map();function append(text){const p=document.createElement('p');p.textContent=text;messages.append(p);messages.scrollTop=messages.scrollHeight;}socket.on('connect',()=>{document.getElementById('status').textContent='Connected';if(name)socket.emit('join',name);});socket.on('disconnect',()=>{document.getElementById('status').textContent='Disconnected; reconnecting...';});join.onsubmit=e=>{e.preventDefault();name=nickname.value.trim();if(!name)return;socket.emit('join',name);join.hidden=true;chat.hidden=false;};chat.onsubmit=e=>{e.preventDefault();if(!socket.connected)return;socket.emit('chat',message.value);socket.emit('typing',false);message.value='';};message.oninput=()=>{socket.emit('typing',true);clearTimeout(timer);timer=setTimeout(()=>socket.emit('typing',false),700);};socket.on('chat',m=>append(m.name+': '+m.text));socket.on('notice',append);socket.on('online',names=>online.textContent='Online: '+names.join(', '));socket.on('typing',m=>{clearTimeout(active.get(m.name));active.delete(m.name);if(m.active)active.set(m.name,setTimeout(()=>{active.delete(m.name);typing.textContent=[...active.keys()].join(', ')+(active.size?' typing...':'');},1500));typing.textContent=[...active.keys()].join(', ')+(active.size?' typing...':'');});
</script></html>
