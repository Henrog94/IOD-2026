<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fake Store</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background-color: #f5f5f5;
        }

        .navbar-brand {
            font-weight: bold;
        }

        .product-card {
            height: 100%;
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-image {
            height: 250px;
            object-fit: contain;
            padding: 20px;
        }

        .product-description {
            height: 100px;
            overflow: hidden;
        }

        .category-icon {
            font-size: 1.2rem;
            margin-right: 5px;
        }

        .price {
            font-size: 1.3rem;
            font-weight: bold;
        }

        #loading {
            text-align: center;
            margin: 40px;
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand">
                <i class="bi bi-shop"></i>
                Fake Store
            </span>
        </div>
    </nav>


    <!-- Main Content -->
    <div class="container">

        <h1 class="text-center mb-4">
            Fake Store Products
        </h1>


        <!-- Filters -->
        <div class="row g-3 mb-4">

            <!-- Search -->
            <div class="col-md-4">
                <label for="searchInput" class="form-label">
                    Search Products
                </label>

                <input
                    type="text"
                    id="searchInput"
                    class="form-control"
                    placeholder="Search for a product...">
            </div>


            <!-- Category -->
            <div class="col-md-4">
                <label for="categorySelect" class="form-label">
                    Category
                </label>

                <select id="categorySelect" class="form-select">
                    <option value="all">All Categories</option>
                </select>
            </div>


            <!-- Sorting -->
            <div class="col-md-4">
                <label for="sortSelect" class="form-label">
                    Sort By
                </label>

                <select id="sortSelect" class="form-select">

                    <option value="default">
                        Default
                    </option>

                    <option value="price-low">
                        Price: Low to High
                    </option>

                    <option value="price-high">
                        Price: High to Low
                    </option>

                    <option value="title-az">
                        Title: A to Z
                    </option>

                    <option value="title-za">
                        Title: Z to A
                    </option>

                </select>
            </div>

        </div>


        <!-- Loading Message -->
        <div id="loading">
            <div class="spinner-border" role="status"></div>

            <p class="mt-2">
                Loading products...
            </p>
        </div>


        <!-- Product Cards -->
        <div
            id="productContainer"
            class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
        </div>

    </div>


    <!-- JavaScript -->
    <script>

        // Store all products from the API
        let products = [];


        // Get references to HTML elements
        const productContainer =
            document.getElementById("productContainer");

        const categorySelect =
            document.getElementById("categorySelect");

        const searchInput =
            document.getElementById("searchInput");

        const sortSelect =
            document.getElementById("sortSelect");

        const loading =
            document.getElementById("loading");


        // Fetch products from Fake Store API
        fetch("https://fakestoreapi.com/products")

            .then(response => {

                if (!response.ok) {
                    throw new Error("Could not load products.");
                }

                return response.json();
            })

            .then(data => {

                // Store API data
                products = data;

                // Hide loading message
                loading.style.display = "none";

                // Create category dropdown options
                createCategoryOptions();

                // Display products
                displayProducts(products);

            })

            .catch(error => {

                loading.innerHTML =
                    `<p class="text-danger">
                        Error loading products: ${error.message}
                    </p>`;

            });


        // Create category dropdown
        function createCategoryOptions() {

            // Get unique categories
            const categories = [
                ...new Set(products.map(product => product.category))
            ];

            categories.forEach(category => {

                const option =
                    document.createElement("option");

                option.value = category;

                option.textContent = category;

                categorySelect.appendChild(option);

            });

        }


        // Display products
        function displayProducts(productList) {

            // Clear existing cards
            productContainer.innerHTML = "";


            // If no products were found
            if (productList.length === 0) {

                productContainer.innerHTML = `
                    <div class="col-12 text-center">
                        <h3>No products found.</h3>
                    </div>
                `;

                return;
            }


            // Create a card for every product
            productList.forEach(product => {

                const card = document.createElement("div");

                card.className = "col";


                // Get category icon
                const icon = getCategoryIcon(product.category);


                card.innerHTML = `

                    <div class="card product-card shadow-sm">

                        <img
                            src="${product.image}"
                            class="card-img-top product-image"
                            alt="${product.title}">

                        <div class="card-body d-flex flex-column">

                            <h5 class="card-title">
                                ${product.title}
                            </h5>

                            <p class="text-muted">

                                <span class="category-icon">
                                    ${icon}
                                </span>

                                ${product.category}

                            </p>

                            <p class="card-text product-description">
                                ${product.description}
                            </p>

                            <p class="price mt-auto">
                                $${product.price.toFixed(2)}
                            </p>

                        </div>

                    </div>

                `;


                productContainer.appendChild(card);

            });

        }


        // Return an icon based on product category
        function getCategoryIcon(category) {

            if (category === "electronics") {

                return `<i class="bi bi-laptop"></i>`;

            }

            if (category === "jewelery") {

                return `<i class="bi bi-gem"></i>`;

            }

            if (category === "men's clothing") {

                return `<i class="bi bi-person"></i>`;

            }

            if (category === "women's clothing") {

                return `<i class="bi bi-person-dress"></i>`;

            }

            return `<i class="bi bi-tag"></i>`;

        }


        // Filter and sort products
        function updateProducts() {

            let filteredProducts = [...products];


            // Get search value
            const searchValue =
                searchInput.value.toLowerCase();


            // Get selected category
            const selectedCategory =
                categorySelect.value;


            // Search filter
            if (searchValue !== "") {

                filteredProducts =
                    filteredProducts.filter(product =>

                        product.title
                            .toLowerCase()
                            .includes(searchValue)

                    );

            }


            // Category filter
            if (selectedCategory !== "all") {

                filteredProducts =
                    filteredProducts.filter(product =>

                        product.category === selectedCategory

                    );

            }


            // Sorting
            const sortValue = sortSelect.value;


            if (sortValue === "price-low") {

                filteredProducts.sort(
                    (a, b) => a.price - b.price
                );

            }


            if (sortValue === "price-high") {

                filteredProducts.sort(
                    (a, b) => b.price - a.price
                );

            }


            if (sortValue === "title-az") {

                filteredProducts.sort(
                    (a, b) =>
                        a.title.localeCompare(b.title)
                );

            }


            if (sortValue === "title-za") {

                filteredProducts.sort(
                    (a, b) =>
                        b.title.localeCompare(a.title)
                );

            }


            // Display the final results
            displayProducts(filteredProducts);

        }


        // Search event
        searchInput.addEventListener(
            "input",
            updateProducts
        );


        // Category event
        categorySelect.addEventListener(
            "change",
            updateProducts
        );


        // Sorting event
        sortSelect.addEventListener(
            "change",
            updateProducts
        );

    </script>

</body>

</html>
