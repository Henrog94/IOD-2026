<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lab 3 - Exercise 3</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 30px;
        }

        .artist {
            background-color: white;
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 10px;

            box-shadow:
                0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .artist-name {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .portfolio {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .portfolio-card {
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 10px;
            overflow: hidden;
        }

        .portfolio-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .portfolio-title {
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Lab 3 - Exercise 3</h1>

    <!-- Artist cards will appear here -->

    <div id="artist-list"></div>


    <!-- Artist Template -->

    <template id="artist-template">

        <div class="artist">

            <div class="artist-name"></div>

            <div class="portfolio"></div>

        </div>

    </template>


    <!-- Portfolio Template -->

    <template id="portfolio-template">

        <div class="portfolio-card">

            <img src="" alt="">

            <div class="portfolio-title"></div>

        </div>

    </template>


    <script>

        const artist = {

            name: "Van Gogh",

            portfolio: [

                {
                    title: "portrait",
                    url: "https://collectionapi.metmuseum.org/api/collection/v1/iiif/436532/1671316/main-image"
                },

                {
                    title: "sky",
                    url: "https://mymodernmet.com/wp/wp-content/uploads/2020/11/White-house-night-van-goh-worldwide-2.jpg"
                }

            ]

        };


        function displayArtist(artist) {

            const artistTemplate =
                document
                    .getElementById("artist-template")
                    .content
                    .cloneNode(true);


            artistTemplate
                .querySelector(".artist-name")
                .innerText = artist.name;


            const portfolioContainer =
                artistTemplate
                    .querySelector(".portfolio");


            artist.portfolio.forEach(function(item) {

                const portfolioCard =
                    document
                        .getElementById("portfolio-template")
                        .content
                        .cloneNode(true);


                const image =
                    portfolioCard.querySelector("img");


                image.src = item.url;

                image.alt = item.title;


                portfolioCard
                    .querySelector(".portfolio-title")
                    .innerText = item.title;


                portfolioContainer.appendChild(
                    portfolioCard
                );

            });


            document
                .getElementById("artist-list")
                .appendChild(artistTemplate);

        }


        displayArtist(artist);

    </script>

</body>

</html>
