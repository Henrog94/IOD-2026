<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lab 3 - Exercise 2</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e3f2fd;
            padding: 30px;
        }

        #card-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: white;
            padding: 20px;
            border-radius: 10px;

            box-shadow:
                0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .card-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .card-text {
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>Lab 3 - Exercise 2</h1>

    <template id="card-template">

        <div class="card">

            <div class="card-title"></div>

            <div class="card-text"></div>

        </div>

    </template>


    <div id="card-list"></div>


    <script>

        const data = [

            {
                name: "Bob",
                age: 23
            },

            {
                name: "Alice",
                age: 39
            },

            {
                name: "Charlie",
                age: 28
            }

        ];


        function addCard(name, age) {

            const template =
                document.getElementById("card-template");

            const card =
                template.content.cloneNode(true);

            card.querySelector(".card-title").innerText =
                name;

            card.querySelector(".card-text").innerText =
                "Age: " + age;

            document
                .getElementById("card-list")
                .appendChild(card);
        }


        data.forEach(function(person) {

            addCard(
                person.name,
                person.age
            );

        });

    </script>

</body>

</html>
